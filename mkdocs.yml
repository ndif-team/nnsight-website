# Project information
site_name: nnsight
site_description: Documentation for the nnsight Python library
site_url: https://nnsight.net

# Repository
repo_name: ndif-team/nnsight
repo_url: https://github.com/ndif-team/nnsight

# Theme configuration
theme:
  name: material
  custom_dir: overrides
  palette:
    # Light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: deep purple
      accent: amber
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    # Dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: deep purple
      accent: amber
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  font:
    text: Inter
    code: JetBrains Mono
  features:
    - navigation.expand
    - navigation.instant
    - navigation.instant.progress
    - navigation.tracking
    - navigation.tabs
    - navigation.indexes
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.code.annotate
    - content.tabs.link
  logo: assets/logo.svg
  favicon: assets/logo.svg
  icon:
    repo: fontawesome/brands/github
    annotation: material/plus-circle

# Hooks
hooks:
  - hooks/social_meta.py
  - hooks/notebook_links.py
  - hooks/page_meta.py

# Plugins
plugins:
  - search
  - social:
      cards_layout: nnsight
      cards_layout_options:
        background_image: docs/assets/social-card-bg.svg
        background_color: transparent
        color: "#ffffff"
        font_family: Inter
        logo: docs/assets/logo-white.svg
  - tags
  - blog
  - mkdocs-jupyter:
      include_source: true
      execute: false
      allow_errors: true
      ignore_h1_titles: true
      no_input: false
      show_input: true
      include_requirejs: true
      # Without this, mkdocs-jupyter emits <script src=""> and MathJax never loads,
      # so every $...$ in every notebook renders as raw TeX. The nbconvert template
      # that ships with the plugin configures the MathJax 2 API, so this must be a 2.x build.
      custom_mathjax_url: "https://cdnjs.cloudflare.com/ajax/libs/mathjax/2.7.7/latest.js?config=TeX-AMS_CHTML-full,Safe"
      kernel_name: python3
      theme: dark
      highlight_extra_classes: ""
  - mkdocstrings:
      enabled: true
      default_handler: python
      handlers:
        python:
          options:
            docstring_style: google
            docstring_options:
              ignore_init_summary: true
            docstring_section_style: spacy
            merge_init_into_class: true
            show_source: false
            show_root_heading: true
            show_root_full_path: false
            show_symbol_type_heading: true
            show_symbol_type_toc: true
            members_order: source
            heading_level: 2
            show_signature_annotations: true
            separate_signature: true
            signature_crossrefs: true
            allow_inspection: true
            show_signature: true
            show_if_no_docstring: true
            

# Extensions
markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - admonition
  - attr_list
  - md_in_html
  - toc:
      permalink: true

