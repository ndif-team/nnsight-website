[project]
name = "nnsight-website"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "cairosvg>=2.7",
    "mkdocs>=1.6.0",
    "mkdocs-autorefs>=1.0.0",
    "mkdocs-jupyter>=0.25.0",
    "mkdocs-material>=9.5.0",
    "mkdocstrings>=0.26.0",
    "mkdocstrings-python>=1.12.0",
    "nnsight",
    "pillow>=10",
]

[project.optional-dependencies]
test = [
    "nnsight",
    # 18_quantization.ipynb loads 4- and 8-bit models; neither is an nnsight
    # dependency, and both are needed to run that notebook locally.
    "accelerate>=1.14.0",
    "bitsandbytes>=0.50.0",
    "datasets>=4.5.0",
    "diffusers>=0.36.0",
    "einops>=0.8.2",
    "matplotlib>=3.10.8",
    "pandas>=3.0.0",
    "plotly>=6.5.2",
    "papermill>=2.6.0",
    "nnsightful @ git+https://github.com/AdamBelfki3/nnsightful.git"
]

# This project ships docs, not Python packages. Without this, setuptools'
# flat-layout autodiscovery sees hooks/, layouts/, overrides/ and bails.
[tool.setuptools]
packages = []
